name: SCP fixed-feedback pacing paper model
on:
  push:
    branches: ['research/slowstart-g-100ms-20261012']
    paths: ['scp.c', 'test/**', '.github/workflows/pacing-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-pacing-${{ github.ref }}
  cancel-in-progress: false
env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      gains: ${{ steps.matrix.outputs.gains }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r test/research/requirements.txt
      - name: Check event model independently against paper formulas
        run: python test/research/test_paper_model.py
      - id: matrix
        run: |
          python - <<'PY'
          import json, os, pathlib
          settings = json.loads(pathlib.Path('test/research/paper_experiment.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('gains=' + json.dumps([g['id'] for g in settings['gains']]) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: dcdb49a09ccfcf6f655ebec3e5028e6db3313ffb
          path: normal
      - name: Verify the committed normal protocol fix
        run: |
          cmake -S normal/test -B normal/build -DCMAKE_BUILD_TYPE=Release
          cmake --build normal/build -j2
          ctest --test-dir normal/build --output-on-failure
  sweep:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        gain: ${{ fromJSON(needs.validate.outputs.gains) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r test/research/requirements.txt
      - name: Three repetitions with exact 100 ms feedback
        run: python test/research/paper_model.py --gain-id '${{ matrix.gain }}' --out results/${{ matrix.gain }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-model-${{ matrix.gain }}
          path: results/${{ matrix.gain }}/
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
  report:
    needs: sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r test/research/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: paper-model-*
          path: results/downloads
      - name: Compare cwnd and packet spread for all gains
        run: python test/research/paper_model.py --merge results/downloads --out results/report
      - run: cat results/report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-model-report
          path: results/report/
          retention-days: 14
          if-no-files-found: error
