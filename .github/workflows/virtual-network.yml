name: SCP transfer curves and network sweep
on:
  push:
    paths: ['scp.c', 'scp.h', 'lib/**', 'test/**', '.github/workflows/virtual-network.yml']
  pull_request:
    paths: ['scp.c', 'scp.h', 'lib/**', 'test/**', '.github/workflows/virtual-network.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: Network sweep profile
        type: choice
        default: scenarios
        options: [quick, broad, large, stress, scenarios, scenarios-1g]
permissions:
  contents: read
jobs:
  transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Integrity and functional checks
        run: ctest --test-dir build --output-on-failure
      - run: python3 -m pip install matplotlib numpy pandas
      - name: Virtual network 1 GiB and protocol curves
        run: python3 test/run.py build/scp_virtual --backend virtual --bytes 1073741824 --mbps 1000 --out results/transfers/virtual-1g
      - name: Linux UDP file transfer 1 GiB and protocol curves
        run: python3 test/run.py build/scp_udp --file-test --bytes 1073741824 --out results/transfers/linux-udp-1g
      - name: Publish transfer results
        if: always()
        run: |
          for report in results/transfers/*/report.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-1g-curves
          path: |
            results/transfers/
            !results/transfers/**/*.bin
          retention-days: 14
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - run: python3 -m pip install matplotlib numpy pandas
      - name: Sweep configured network environments
        env:
          PROFILE: ${{ inputs.profile || 'scenarios' }}
        run: python3 test/virtual/sweep.py build/scp_virtual --config test/virtual/network_sweep.json --profile "$PROFILE" --shard-index ${{ matrix.shard }} --shard-count 8 --jobs 2 --out results/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-shard-${{ matrix.shard }}
          path: results/
          retention-days: 14
  report:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: network-shard-*
          merge-multiple: true
          path: results
      - run: python3 -m pip install matplotlib numpy pandas
      - run: python3 test/virtual/sweep.py --merge results
      - run: python3 test/plot.py results
        if: always()
      - run: cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-report
          path: results/
          retention-days: 14
